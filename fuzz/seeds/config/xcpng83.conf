# XCP-ng 8.3's oxenstored.conf keys, log destinations as shipped.
test-eagain = false
merge-activate = true
conflict-burst-limit = 5.0
conflict-max-history-seconds = 0.05
conflict-rate-limit-is-aggregate = true
perms-activate = true
perms-watch-activate = true
quota-activate = true
quota-maxentity = 8192
quota-maxsize = 2048
quota-maxwatch = 512
quota-transaction = 10
quota-maxrequests = 1024
quota-path-max = 1024
quota-maxoutstanding = 1024
quota-maxwatchevents = 1024
persistent = false
xenstored-log-file = syslog:daemon
xenstored-log-level = info
xenstored-log-nb-files = 10
xenstored-log-nb-lines = 13215
xenstored-log-nb-chars = -1
access-log-file = syslog:local3
access-log-nb-files = 20
access-log-nb-lines = 13215
access-log-nb-chars = 180
access-log-read-ops = false
access-log-transactions-ops = false
access-log-special-ops = false
allow-debug = false
ring-scan-interval = 20
pid-file = /var/run/xenstored.pid
xenstored-kva = /proc/xen/xsd_kva
xenstored-port = /proc/xen/xsd_port
